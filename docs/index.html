<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js" integrity="sha512-vc58qvvBdrDR4etbxMdlTt4GBQk1qjvyORR2nrsPsFPyrs+/u5c3+1Ct6upOgdZoIl7eq6k3a1UPDSNAQi/32A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
window.feed = (() => {
  const TABLES = ["latest", "recent", "monthly", "world", "info", "forms", "articles"], sets = {}, calcs = {}, subs = [];
  const fire = () => subs.forEach((f) => { try { f(); } catch (e) { console.error(e); } });
  const data = (id) => {
    if (calcs[id]) {
      const ins = calcs[id].inputs.map(data);
      if (ins.some((i) => i.status === 'error')) return {status: 'error', data: [], message: 'an input failed to load'};
      if (!ins.every((i) => i.status === 'ok')) return {status: 'loading', data: []};
      try { return {status: 'ok', data: calcs[id].fn(...ins.map((i) => i.data))}; } catch (e) { return {status: 'error', data: [], message: String(e)}; }
    }
    return sets[id] || {status: 'missing', data: []};
  };
  for (const id of TABLES) {
    sets[id] = {status: 'loading', data: [], columns: []};
    fetch(`data/${id}.csv`, {cache: 'no-cache'}).then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); })
      .then((t) => { const rows = d3.csvParse(t); sets[id] = {status: 'ok', data: rows, columns: rows.columns}; fire(); })
      .catch((e) => { sets[id] = {status: 'error', data: [], columns: [], message: String(e)}; fire(); });
  }
  let timer, width = window.innerWidth; window.addEventListener('resize', () => { if (window.innerWidth === width) return; width = window.innerWidth; clearTimeout(timer); timer = setTimeout(fire, 150); });
  return {data, onData: (fn) => { subs.push(fn); fn(); }, calc: (id, c) => { calcs[id] = c; }, colors: ['var(--series-1)']};
})();
</script>

  q('#spt-region').setAttribute('aria-label', t('region'));

  q('#spt-calc').replaceChildren(...(I18N[lang].calc || []).flatMap(([a, b, c]) => { const d = el('dd', '', b); if (c) d.append(el('span', 'spt-ex', `${t('ex')} ${c}`)); return [el('dt', '', a), d]; }));

root.querySelectorAll('.spt-lang button').forEach((b) => b.addEventListener('click', () => { if (b.dataset.lang === lang) return; lang = b.dataset.lang; try { localStorage.setItem('spt-lang', lang); } catch (err) {} q('#spt-region').replaceChildren(); draw(); }));

q('#spt-above').addEventListener('change', () => draw());
q('#spt-table thead').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-sort]'); if (!b) return;

const pick = (e) => { const tr = e.target.closest('tr[data-key]'), key = e.type === 'keydown' && (e.key === 'Enter' || e.key === ' '); if (tr && (e.type === 'click' || key)) { if (key) e.preventDefault(); state.country = tr.dataset.key; draw(); if (key) { const again = q('#spt-table tbody tr[aria-selected=true]'); if (again) again.focus({preventScroll: true}); } q('#detail').scrollIntoView({behavior: 'smooth', block: 'nearest'}); } };

function spark(td, rows, usual) {

  const x = d3.scaleLinear([0, v.length - 1], [1, w - 1]), y = d3.scaleLinear([0, Math.max(d3.max(v), (usual || 0) * 2, 1e-6)], [h - 2, 2]);
  const svg = d3.select(td).append('svg').attr('width', w).attr('height', h).attr('viewBox', `0 0 ${w} ${h}`).attr('role', 'img').attr('aria-label', t('th_spark'));
  if (isFinite(usual)) svg.append('line').attr('x1', 0).attr('x2', w).attr('y1', y(usual)).attr('y2', y(usual)).attr('stroke', 'var(--ui-chart-reference)').attr('stroke-dasharray', '2 2');
  svg.append('path').attr('d', d3.line((d, i) => x(i), (d) => y(d))(v)).attr('fill', 'none').attr('stroke', feed.colors[0]).attr('stroke-width', 1.5).attr('stroke-linejoin', 'round');
  svg.append('circle').attr('cx', x(v.length - 1)).attr('cy', y(v[v.length - 1])).attr('r', 2.2).attr('fill', feed.colors[0]);
}
const axes = (svg, x, y, W, H, m, xfmt, every) => {
  svg.append('g').selectAll('line').data(y.ticks(4)).join('line').attr('x1', m.l).attr('x2', W - m.r).attr('y1', y).attr('y2', y).attr('stroke', 'var(--ui-chart-grid)');
  svg.append('g').attr('transform', `translate(0,${H - m.b})`).call(d3.axisBottom(x).ticks(Math.max(2, Math.floor(W / every))).tickFormat(xfmt).tickSizeOuter(0)).attr('font-size', null).attr('font-family', null).attr('color', 'var(--color-fg-muted)');
  svg.append('g').attr('transform', `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(4).tickFormat((v) => nf(v < 10 && y.domain()[1] < 5 ? 1 : 0).format(v)).tickSize(0)).attr('font-size', null).attr('font-family', null).attr('color', 'var(--color-fg-muted)').select('.domain').remove();
};
const place = (tip, box, px, py, W, H) => { const tw = tip.node().offsetWidth; tip.style('left', Math.min(Math.max(px * box.clientWidth / W - tw / 2, 0), Math.max(box.clientWidth - tw, 0)) + 'px').style('top', Math.max(py * box.clientHeight / H - 34, 0) + 'px'); };

  svg.append('path').attr('d', line(Wd.filter((p) => p.d >= P[0].d))).attr('fill', 'none').attr('stroke', 'var(--ui-chart-muted)').attr('stroke-width', 1.5).attr('stroke-dasharray', '1 3').attr('stroke-linecap', 'round');
  if (isFinite(usual)) svg.append('line').attr('x1', m.l).attr('x2', W - m.r).attr('y1', y(usual)).attr('y2', y(usual)).attr('stroke', 'var(--ui-chart-reference)').attr('stroke-dasharray', '5 4');
  svg.append('path').attr('d', line(P)).attr('fill', 'none').attr('stroke', feed.colors[0]).attr('stroke-width', 2).attr('stroke-linejoin', 'round').attr('stroke-linecap', 'round');
  const last = P[P.length - 1], labels = [{s: `${t('l_now')} ${fmt(last.v)}`, y: y(last.v), c: feed.colors[0]}];
  if (isFinite(usual)) labels.push({s: `${t('l_usual')} ${fmt(usual)}`, y: y(usual), c: 'var(--color-fg-muted)'});
  if (Wd.length) labels.push({s: `${t('l_world')} ${fmt(Wd[Wd.length - 1].v)}`, y: y(Wd[Wd.length - 1].v), c: 'var(--color-fg-muted)'});
  labels.sort((a, b) => a.y - b.y); for (let i = 1; i < labels.length; i++) labels[i].y = Math.max(labels[i].y, labels[i - 1].y + 12);
  svg.append('g').selectAll('text').data(labels).join('text').attr('x', W - m.r + 6).attr('y', (l) => l.y + 3).attr('fill', (l) => l.c).attr('font-size', 11).text((l) => l.s);
  const tip = d3.select(box).append('div').attr('class', 'spt-tip').attr('hidden', true), dot = svg.append('circle').attr('r', 3.5).attr('fill', feed.colors[0]).attr('opacity', 0), full = dfmt({day: 'numeric', month: 'long', year: 'numeric'});
  svg.on('pointermove', (e) => {
    const [mx] = d3.pointer(e), p = P[d3.leastIndex(P, (z) => Math.abs(x(z.d) - mx))]; dot.attr('cx', x(p.d)).attr('cy', y(p.v)).attr('opacity', 1);
    tip.attr('hidden', null).text(t('tip_day', {date: full.format(p.d), v: fmt(p.v), n: int(isFinite(p.n) ? p.n : 0)})); place(tip, box, x(p.d), y(p.v), W, H);
  }).on('pointerleave', () => { tip.attr('hidden', true); dot.attr('opacity', 0); });
}

function monthChart(box, rows, name) {
  box.classList.remove('spt-wait'); box.replaceChildren();
  const W = Math.max(box.clientWidth, 280), H = 240, m = {t: 10, r: 8, b: 24, l: 40}, P = rows.map((r) => ({d: new Date(r.month), v: num(r.share), n: num(r.reports)})).filter((p) => isFinite(p.v));

    [['data/latest.csv', 'foot_latest'], ['data/recent.csv', 'foot_recent'], ['data/monthly.csv', 'foot_monthly'], ['data/articles.csv', 'foot_articles'], ['data/levels.csv', 'foot_levels']].forEach(([h, k], i) => { if (i) tables.append(', '); tables.append(link(h, t(k))); });
    const parts = [el('span', '', t('foot_update')), tables]; for (const [h, k] of [[LINKS.chronique, 'foot_chronique'], [LINKS.note, 'foot_note']]) if (h) { const sp = el('span'); sp.append(link(h, t(k))); parts.push(sp); }
    foot.replaceChildren(...parts); foot.hidden = false;

  const rows = L.data.filter((r) => Number(r.tracked) === 1).map((r) => ({...r, run_days: num(r.run_days), far_days_year: num(r.far_days_year), located: num(r.located), articles: num(r.articles), share: num(r.share), usual: num(r.usual), percentile: num(r.percentile), percentile_season: num(r.percentile_season), reports: num(r.reports), active_days: num(r.active_days), reports_per_week: num(r.reports_per_week)}));
  rows.forEach((r) => { r.rank = (RANK[r.tier] || 0) * 1000 + Math.min(r.percentile, r.percentile_season); r.name = nm(r); });
  const nameOf = new Map(L.data.map((r) => [r.country, nm(r)]));

    const top = rows.filter((r) => r.tier === 'exceptional' || r.tier === 'high').sort((a, b) => b.rank - a.rank || b.reports - a.reports).map((r) => r.name);
    const far = n.exceptional + n.high, far0 = info && num(info.far_all_places) > far ? num(info.far_all_places) : far, days = info ? num(info.far_days_at_least_now) : NaN, eps = info ? num(info.far_episodes_at_least_now) : NaN;
    const list = (a) => { try { return new Intl.ListFormat(loc(), {style: 'long', type: 'conjunction'}).format(a); } catch (e) { return a.join(', '); } };
    const v = {y: (info ? info.history_from || '' : '').slice(0, 4), m: info ? int(num(info.far_median)) : '', n: int(far0), dd: days === 1 ? t('days_1') : t('days_n', {d: int(days)}), ee: eps === 1 ? t('eps_1') : t('eps_n', {e: int(eps)})};
    const base = info && isFinite(num(info.far_median)) && isFinite(days) && far ? t(far0 > far ? 'take_cmp' : 'take_hist', v) + t(days === 0 ? 'take_tail0' : 'take_tail', v) : '';

  }

  const text = q('#spt-search').value.trim().toLowerCase(), region = sel.value, above = q('#spt-above').checked;
  const shown = rows.filter((r) => (!text || r.name.toLowerCase().includes(text) || r.country.toLowerCase().includes(text)) && (!region || r.region === region) && (!above || r.tier !== 'usual'))
    .sort((a, b) => { const k = state.sort, u = a[k], v = b[k]; return (typeof u === 'string' ? u.localeCompare(v, loc()) : (isFinite(u) ? u : -Infinity) - (isFinite(v) ? v : -Infinity)) * state.dir || b.reports - a.reports; });
  if (!state.country || !rows.some((r) => r.country === state.country)) state.country = (rows.find((r) => r.country === 'France') || rows[0] || {}).country;
  const byC = R.status === 'ok' ? d3.group(R.data, (r) => r.country) : new Map();

  tbody.replaceChildren(...shown.map((r) => {
    const tr = el('tr'); tr.dataset.key = r.country; tr.tabIndex = 0; tr.setAttribute('aria-selected', String(r.country === state.country));
    const cell = (s, cls) => { const td = el('td', cls, s); tr.append(td); return td; };
    cell(r.name); cell(t('t_' + r.tier), `spt-l spt-pill spt-t-${r.tier}`); const sp = cell('', 'spt-l spt-spark'); cell(int(r.reports)); cell(int(r.active_days)); cell(fmt(r.share)); cell(fmt(r.usual));
    cell(isFinite(r.percentile) ? int(Math.floor(r.percentile)) : '–'); cell(isFinite(r.percentile_season) ? int(Math.floor(r.percentile_season)) : '–'); cell(t('d_' + r.data) + (r.signal ? ' · ' + t(r.signal === 'elsewhere' ? 'held_else' : 'held') : '') + (r.press === 'closed' ? ' · ' + t('press_closed') : ''), 'spt-l');

    return tr;
  }));

  q('#spt-dnote').textContent = cur ? t('d_note', {now: fmt(cur.share), u: fmt(cur.usual), tier: t('t_' + cur.tier), n: int(cur.reports), a: isFinite(cur.articles) ? int(cur.articles) : '?', d: int(cur.active_days), w: cur.reports_per_week >= 0.1 ? t('w_some', {x: nf(1).format(cur.reports_per_week)}) : t('w_none'), run: (cur.run_days > 1 ? t('run_n', {k: int(cur.run_days)}) : cur.run_days === 1 ? t('run_1') : '') + (isFinite(cur.far_days_year) ? t('year_far', {k: int(cur.far_days_year)}) : '') + (isFinite(cur.located) && cur.reports > cur.located ? t('d_mis', {m: int(cur.reports - cur.located)}) : '') + (cur.press === 'closed' ? t('d_press') : '')}) : '';
  const lb = q('#spt-line'), mb = q('#spt-months'), fb = q('#spt-forms'), ab = q('#spt-arts');
  if (R.status === 'ok' && Wd.status === 'ok') lineChart(lb, byC.get(key) || [], Wd.data, cur ? cur.usual : NaN, name); else if (R.status === 'error' || Wd.status === 'error') failed(lb); else { lb.replaceChildren(); lb.classList.add('spt-wait'); }
