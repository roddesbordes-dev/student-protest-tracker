.spt-t-exceptional.spt-pill::before { content: '\25CF\25CF\25CF'; }
.spt-t-high.spt-pill::before { content: '\25CF\25CF\25CB'; }
.spt-t-elevated.spt-pill::before { content: '\25CF\25CB\25CB'; }
.spt-controls { display: flex; flex-wrap: wrap; gap: var(--cds-gap-sm); align-items: center; }
.spt-controls input, .spt-controls select { font: inherit; color: var(--color-fg); background: var(--color-bg); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-xs) var(--cds-pad-sm); min-width: 0; max-width: 100%; }

.spt table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: var(--cds-font-size-body); }
.spt th { position: sticky; top: 0; background: var(--color-panel); text-align: right; font-weight: var(--cds-font-weight-medium); font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); padding: .4rem .6rem; border-bottom: 1px solid var(--color-border-line); white-space: nowrap; }
.spt th:first-child, .spt td:first-child, .spt th.spt-l, .spt td.spt-l { text-align: left; }

.spt th button:focus-visible, .spt tbody tr:focus-visible, .spt a:focus-visible { outline: 2px solid var(--color-fg); outline-offset: 2px; }
.spt td { text-align: right; padding: .38rem .6rem; border-bottom: 1px solid var(--color-border-line); white-space: nowrap; }
.spt #spt-waves td.spt-l, .spt #spt-waves th { white-space: normal; }
.spt #spt-table tbody tr { cursor: pointer; }
.spt #spt-table tbody tr:hover, .spt #spt-table tbody tr[aria-selected=true] { background: var(--color-bg); }
.spt td.spt-spark { padding-block: .1rem; }
.spt-grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 30rem), 1fr)); gap: var(--cds-gap-md); }
.spt-grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr)); gap: var(--cds-gap-md); }
.spt-chart { position: relative; min-height: 15rem; }
.spt-tip { position: absolute; pointer-events: none; background: var(--cds-surface-popover); border: 1px solid var(--cds-border); border-radius: var(--cds-radius); box-shadow: var(--cds-shadow-popover); padding: var(--cds-pad-xs) var(--cds-pad-sm); font-size: var(--cds-font-size-caption); white-space: nowrap; }
.spt-fail { display: flex; align-items: center; justify-content: center; gap: .4rem; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); min-height: 6rem; }
.spt-fail::before { content: ""; width: .375rem; height: .375rem; border-radius: 50%; background: var(--color-bad); }

.spt-forms { display: flex; flex-direction: column; gap: .45rem; min-height: 8rem; }

.spt-form span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--color-fg-muted); }
.spt-arts { display: flex; flex-direction: column; gap: .55rem; margin: 0; padding: 0; list-style: none; min-height: 8rem; }
.spt-arts li { display: flex; flex-direction: column; gap: .1rem; min-width: 0; }
.spt-arts a, .spt-foot a { color: var(--color-fg); text-decoration: underline; text-underline-offset: 2px; overflow-wrap: anywhere; }

.spt [hidden] { display: none !important; }

<div class="spt">
  <header class="spt-head">
    <div class="spt-top">
      <h1 id="top" data-i18n="title">Student protest tracker</h1>

  </header>

  <section class="spt-tiles" id="tiers">

    <div class="spt-card spt-tile spt-t-usual"><span class="spt-num dash-skeleton" data-source="tiers" data-field="n" data-where="tier=usual">—</span><span class="spt-lab"><span class="spt-dots">○○○</span><span data-i18n="tier_usual">Usual</span></span><span class="spt-muted" data-cap="usual"></span></div>
  </section>

  <section class="spt-card" id="countries">
    <h2 data-i18n="countries_h">Countries, highest relative to their own past first</h2>
    <p class="spt-muted" data-i18n="countries_note"></p>
    <div class="spt-controls">
      <input id="spt-search" type="search" data-i18n-ph="search">
      <label><span data-i18n="region">Region</span> <select id="spt-region"></select></label>
      <label><input id="spt-above" type="checkbox"> <span data-i18n="above">Only above usual</span></label>
    </div>
    <div class="spt-scroll">
      <table id="spt-table" data-source="latest" data-row-key="country">
        <thead><tr>
          <th data-field="country"><button data-sort="name" data-i18n="th_country">Country</button></th>
          <th class="spt-l" data-field="tier"><button data-sort="rank" data-i18n="th_level">Level</button></th>
          <th class="spt-l" data-source="recent" data-i18n="th_spark">Last 90 days</th>
          <th data-field="reports"><button data-sort="reports" data-i18n="th_reports">Reports, 7 days</button></th>
          <th data-field="active_days"><button data-sort="active_days" data-i18n="th_days">Days</button></th>
          <th data-field="share"><button data-sort="share" data-i18n="th_now">Now, per 1,000</button></th>
          <th data-field="usual"><button data-sort="usual" data-i18n="th_usual">Usual</button></th>
          <th data-field="percentile"><button data-sort="percentile" data-i18n="th_pct">Percentile, 3 yr</button></th>
          <th data-field="percentile_season"><button data-sort="percentile_season" data-i18n="th_pcts">Percentile, season</button></th>
          <th class="spt-l" data-field="data"><button data-sort="reports_per_week" data-i18n="th_data">Data</button></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="spt-grid2" id="detail">
    <div class="spt-card"><h2 id="spt-dtitle"></h2><p class="spt-muted" id="spt-dnote"></p><div class="spt-chart dash-skeleton" id="spt-line" data-source="recent world latest"></div></div>
    <div class="spt-card"><h2 id="spt-mtitle"></h2><p class="spt-muted" data-i18n="m_note"></p><div class="spt-chart dash-skeleton" id="spt-months" data-source="monthly"></div></div>
    <div class="spt-card"><h2 id="spt-ftitle"></h2><p class="spt-muted" data-i18n="f_note"></p><div class="spt-forms" id="spt-forms" data-source="forms"></div></div>

  </section>

  <p class="spt-muted" data-i18n="sources"></p>
  <footer class="spt-foot" id="spt-foot" hidden></footer>
</div>
